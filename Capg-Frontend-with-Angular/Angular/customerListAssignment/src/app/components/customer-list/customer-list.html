<input 
  type="text"
  placeholder="Search by name"
  (input)="onSearchChange($event.target.value)"
/>

<div>
  <app-customer-details 
    *ngFor="let customer of paginatedCustomers" 
    [customer]="customer">
  </app-customer-details>
</div>

<app-pagination
  [totalItems]="filteredCustomers.length"
  [pageSize]="size"
  [currentPage]="page"
  (pageChange)="onPageChange($event)">
</app-pagination>
