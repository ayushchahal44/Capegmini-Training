# SonarQube Project Configuration
sonar.projectKey=finflow
sonar.projectName=FinFlow Loan Management
sonar.projectVersion=0.0.1-SNAPSHOT

# Multi-module Maven project — let Maven Sonar plugin handle source paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Exclusions — same as JaCoCo
sonar.exclusions=**/test/**, **/target/**, **/.mvn/**, **/config/**, **/dto/**, **/entity/**, **/exception/**, **/*Application.java, **/SecurityUtils.java

# Encoding
sonar.sourceEncoding=UTF-8

# Jacoco Coverage
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml