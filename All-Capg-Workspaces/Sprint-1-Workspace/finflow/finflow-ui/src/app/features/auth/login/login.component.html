<div class="auth-container fade-in">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="logo-circle">F</div>
      <h1>Welcome Back</h1>
      <p>Login to manage your loan applications</p>
    </div>

    @if (error) {
      <div class="error-alert">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <lucide-icon [name]="icons.mail" [size]="18" class="input-icon"></lucide-icon>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="credentials.email" 
            required 
            placeholder="name@example.com"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <lucide-icon [name]="icons.lock" [size]="18" class="input-icon"></lucide-icon>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="credentials.password" 
            required 
            placeholder="••••••••"
          >
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-block" 
        [disabled]="loginForm.invalid || loading"
      >
        @if (loading) {
          <lucide-icon [name]="icons.loader" [size]="18" class="spin"></lucide-icon>
          Authenticating...
        } @else {
          Sign In
          <lucide-icon [name]="icons.arrowRight" [size]="18"></lucide-icon>
        }
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/auth/signup">Create one</a>
    </div>
  </div>
</div>
