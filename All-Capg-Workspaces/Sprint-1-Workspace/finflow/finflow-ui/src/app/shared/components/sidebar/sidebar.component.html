<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="logo-area">
      <div class="logo-icon">F</div>
      <span class="logo-text">FinFlow</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
      <lucide-icon [name]="icons.dashboard" [size]="20"></lucide-icon>
      <span>Dashboard</span>
    </a>
    <a routerLink="/admin/loans" routerLinkActive="active" class="nav-item">
      <lucide-icon [name]="icons.loans" [size]="20"></lucide-icon>
      <span>Loans</span>
    </a>
    <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
      <lucide-icon [name]="icons.customers" [size]="20"></lucide-icon>
      <span>Customers</span>
    </a>
    <a routerLink="/admin/reports" routerLinkActive="active" class="nav-item">
      <lucide-icon [name]="icons.reports" [size]="20"></lucide-icon>
      <span>Reports</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item logout-btn" (click)="logout()">
      <lucide-icon [name]="icons.logout" [size]="20"></lucide-icon>
      <span>Sign Out</span>
    </button>
    
    <button class="collapse-btn" (click)="toggleCollapse()">
      <lucide-icon [name]="collapsed ? icons.expand : icons.collapse" [size]="18"></lucide-icon>
    </button>
  </div>
</aside>
