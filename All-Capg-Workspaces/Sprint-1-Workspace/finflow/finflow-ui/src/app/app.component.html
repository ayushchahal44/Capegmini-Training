<div [class.dark-theme]="true">
  @if (showDashboardLayout) {
    <!-- Authenticated Layout: Sidebar + TopBar + Content -->
    <div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">
      <app-sidebar
        [collapsed]="sidebarCollapsed"
        (collapsedChange)="sidebarCollapsed = $event"
      ></app-sidebar>

      <div class="app-main">
        <app-top-bar
          [sidebarCollapsed]="sidebarCollapsed"
          (toggleSidebar)="onSidebarToggle()"
        ></app-top-bar>

        <main class="app-content">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  } @else {
    <!-- Unauthenticated Layout: Full-screen (login/signup) -->
    <main class="app-fullscreen">
      <router-outlet></router-outlet>
    </main>
  }

  <app-toast></app-toast>
</div>
