spring.application.name=finflow-gateway
server.port=8090
spring.main.web-application-type=reactive

# Routes
spring.cloud.gateway.routes[0].id=finflow-auth
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/gateway/auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/gateway/auth/(?<segment>.*), /api/auth/${segment}

spring.cloud.gateway.routes[1].id=finflow-applications
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/gateway/applications/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/gateway/applications/(?<segment>.*), /api/applications/${segment}

spring.cloud.gateway.routes[2].id=finflow-documents
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/gateway/documents/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/gateway/documents/(?<segment>.*), /api/documents/${segment}

spring.cloud.gateway.routes[3].id=finflow-admin
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/gateway/admin/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/gateway/admin/(?<segment>.*), /api/admin/${segment}

spring.cloud.gateway.routes[4].id=finflow-notifications
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/gateway/notifications/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/gateway/notifications/(?<segment>.*), /api/notifications/${segment}

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost

# Management
management.endpoints.web.exposure.include=health,tracing,gateway
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
