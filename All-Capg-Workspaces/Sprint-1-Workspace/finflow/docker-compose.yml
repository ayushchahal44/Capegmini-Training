# FinFlow Microservices Orchestration
# Infrastructure: Zipkin, RabbitMQ, MySQL
# Services: Eureka, Auth, Application, Document, Admin, Notification, Gateway, UI

x-spring-env: &spring-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://finflow-eureka:8761/eureka
  SPRING_DATASOURCE_URL: jdbc:mysql://finflow-mysql:3306/finflowdb?allowPublicKeyRetrieval=true&useSSL=false
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root
  FINFLOW_JWT_SECRET: ${FINFLOW_JWT_SECRET:-finflow-dev-secret-key-change-me-please-use-256-bits-minimum-for-hs256-algorithm}
  SPRING_RABBITMQ_HOST: rabbitmq
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://finflow-zipkin:9411/api/v2/spans
  FINFLOW_SERVICES_AUTH_URL: http://finflow-auth-service:8081
  FINFLOW_SERVICES_APPLICATION_URL: http://finflow-application-service:8082
  FINFLOW_SERVICES_DOCUMENT_URL: http://finflow-document-service:8083
  FINFLOW_SERVICES_ADMIN_URL: http://finflow-admin-service:8084
  _JAVA_OPTIONS: "-Xmx256m -Xms128m"

networks:
  finflow-network:
    driver: bridge

services:
  finflow-zipkin:
    image: openzipkin/zipkin
    container_name: finflow-zipkin
    ports:
      - "9411:9411"
    networks:
      - finflow-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M

  finflow-mysql:
    image: mysql:8.0
    container_name: finflow-mysql
    environment:
      MYSQL_DATABASE: finflowdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - finflow-network
    deploy:
      resources:
        limits:
          memory: 512M

  finflow-eureka:
    build:
      context: .
      dockerfile: finflow-eureka-server/Dockerfile
    container_name: finflow-eureka
    ports:
      - "8761:8761"
    environment:
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8761/actuator/health/liveness" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 640M

  finflow-auth-service:
    build:
      context: .
      dockerfile: finflow-auth-service/Dockerfile
    container_name: finflow-auth-service
    ports:
      - "8081:8081"
    environment:
      <<: *spring-env
    depends_on:
      finflow-mysql:
        condition: service_healthy
      finflow-eureka:
        condition: service_healthy
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health/liveness" ]
      interval: 25s
      timeout: 15s
      retries: 12
      start_period: 360s
    deploy:
      resources:
        limits:
          memory: 1024M

  finflow-application-service:
    build:
      context: .
      dockerfile: finflow-application-service/Dockerfile
    container_name: finflow-application-service
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
    depends_on:
      finflow-mysql:
        condition: service_healthy
      finflow-eureka:
        condition: service_healthy
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8082/actuator/health/liveness" ]
      interval: 25s
      timeout: 15s
      retries: 12
      start_period: 360s
    deploy:
      resources:
        limits:
          memory: 512M

  finflow-document-service:
    build:
      context: .
      dockerfile: finflow-document-service/Dockerfile
    container_name: finflow-document-service
    ports:
      - "8083:8083"
    environment:
      <<: *spring-env
      FINFLOW_STORAGE_ROOT: /app/uploads
    volumes:
      - document-uploads:/app/uploads
    depends_on:
      finflow-mysql:
        condition: service_healthy
      finflow-eureka:
        condition: service_healthy
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8083/actuator/health/liveness" ]
      interval: 25s
      timeout: 15s
      retries: 12
      start_period: 360s
    deploy:
      resources:
        limits:
          memory: 512M

  finflow-admin-service:
    build:
      context: .
      dockerfile: finflow-admin-service/Dockerfile
    container_name: finflow-admin-service
    ports:
      - "8084:8084"
    environment:
      <<: *spring-env
    depends_on:
      finflow-mysql:
        condition: service_healthy
      finflow-eureka:
        condition: service_healthy
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8084/actuator/health/liveness" ]
      interval: 25s
      timeout: 15s
      retries: 12
      start_period: 360s
    deploy:
      resources:
        limits:
          memory: 512M

  finflow-notification-service:
    build:
      context: .
      dockerfile: finflow-notification-service/Dockerfile
    container_name: finflow-notification-service
    ports:
      - "8085:8085"
    environment:
      <<: *spring-env
    depends_on:
      finflow-mysql:
        condition: service_healthy
      finflow-eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8085/actuator/health/liveness" ]
      interval: 25s
      timeout: 15s
      retries: 12
      start_period: 360s
    deploy:
      resources:
        limits:
          memory: 512M

  finflow-gateway:
    build:
      context: .
      dockerfile: finflow-gateway/Dockerfile
    container_name: finflow-gateway
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://finflow-eureka:8761/eureka
      FINFLOW_JWT_SECRET: ${FINFLOW_JWT_SECRET:-finflow-dev-secret-key-change-me-please-use-256-bits-minimum-for-hs256-algorithm}
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 10000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 60s
      _JAVA_OPTIONS: "-Xmx320m -Xms192m"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://finflow-zipkin:9411/api/v2/spans
    depends_on:
      finflow-eureka:
        condition: service_healthy
      finflow-auth-service:
        condition: service_healthy
    networks:
      - finflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8090/actuator/health/liveness" ]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 660s
    deploy:
      resources:
        limits:
          memory: 640M

  finflow-ui:
    build:
      context: ./finflow-ui
      dockerfile: Dockerfile
    container_name: finflow-ui
    ports:
      - "4200:80"
    depends_on:
      finflow-gateway:
        condition: service_healthy
    networks:
      - finflow-network
    deploy:
      resources:
        limits:
          memory: 256M

